# ROUTE REGISTRY -- the single source of truth.
#
# codex-run.sh reads model, effort, config, sandbox, timeout and the background
# requirement from here. The route table in SKILL.md is GENERATED from this file
# by bin/gen-routes-table.sh. Edit routes here and nowhere else: the prose is
# derived from the mechanism, so the two cannot drift apart.
#
# FIELDS
#   route       route name (what you put in a request file)
#   model       full model slug, never a moving alias
#   effort      model_reasoning_effort
#   config      ignore = --ignore-user-config | base = load the user config
#   profile     none | claude-safe
#               Under config=ignore a profile has no effect, so it must be
#               `none` there. The runner enforces this.
#   sandbox     read-only | workspace-write
#   form        exec   = codex exec, prompt read from a file
#               review = built-in reviewer (codex exec review --commit <SHA>),
#                        which accepts no prompt at all
#   timeout     seconds, passed to the portable timeout wrapper
#   background  no  = may run in the foreground
#               yes = background only; the runner refuses without
#                     confirm_background=yes in the request
#   allows      optional request fields this route accepts. Anything not listed
#               is rejected. An empty value means "no optional fields".
#   purpose     one line, shown in the generated route table
#
# COMPLETENESS RULE: an unknown route, an unknown field, or a value outside its
# enum is refused outright. There are no silent defaults anywhere.

route: ping
model: gpt-5.6-luna
effort: low
config: ignore
profile: none
sandbox: read-only
form: exec
timeout: 120
background: no
allows: session_id,ephemeral
purpose: Ping, or a short factual question

